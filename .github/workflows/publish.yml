name: Publish

# Publishes to npm when a GitHub release is published, so creating the release is the one step that ships
# a version.
# npm trusted publishing: the workflow signs in to npm with its GitHub OIDC identity
# (id-token: write), so no token is stored anywhere. The package's npm settings name
# this repository, this workflow file and the environment "npm" as its trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: The release tag must match package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match version $version"
            exit 1
          fi
      # npm rather than bun: trusted publishing and provenance are npm's
      - name: Publish, unless this version is already on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "web-ext-deploy@$version" version 2>/dev/null)" ]; then
            echo "web-ext-deploy@$version is already on npm"
            exit 0
          fi
          npm publish --provenance --access public
